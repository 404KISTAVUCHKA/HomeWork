<!DOCTYPE html>
<html>
<head>
    <style>
        .link {
            text-decoration: none;
            color: #333;
            font-size: 18px;
            position: relative;
            padding-bottom: 5px;
        }
        
        .link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: #3498db;
            transition: width 0.3s;
        }
        
        .link:hover::after {
            width: 100%;
        }
    </style>
</head>
<body>
    <a href="#" class="link">Наведи на меня курсор</a>
</body>
</html>
